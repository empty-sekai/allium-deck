[package]
name = "allium-deck-server"
version = "0.0.15"
edition = "2024"
description = "HTTP service for the allium-deck recommendation engine"
license = "MIT OR Apache-2.0"
repository = "https://github.com/empty-sekai/allium-deck"
publish = false

[workspace]
resolver = "2"

[lib]
name = "allium_deck_server"
path = "src/lib.rs"

[[bin]]
name = "allium-deck-server"
path = "src/main.rs"

[dependencies]
allium-deck = { path = "..", version = "=0.0.15" }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "signal", "time", "sync", "macros"] }
tower-http = { version = "0.7.1", features = ["catch-panic", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mimalloc = { version = "0.1.52", optional = true }

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { version = "0.6", optional = true }


[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[features]
# The allocator default is set from the measurements in docker/README.en.md.
default = []
jemalloc = ["dep:tikv-jemallocator"]
mimalloc = ["dep:mimalloc"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Deliberately not `panic = "abort"`: a panicking request is turned into a 500 by
# the catch-panic layer, and the process keeps serving the other requests.
