# allium-deck standalone 最小 workspace 根。
#
# 为什么需要它：crates/allium-deck/Cargo.toml 用了 workspace 继承
#   serde = { workspace = true }   (thiserror / serde_json 同理)
# 这要求父 workspace 提供 [workspace.dependencies]。脱离 allium-scapus 时父 workspace
# 带着 skia/tokio 等一堆重依赖，编不动。这里造一个只含 allium-deck 需要的三个依赖的
# 最小 workspace 根，docker/Dockerfile 把它拷成 /build/Cargo.toml。
#
# 维护：若 crates/allium-deck/Cargo.toml 的 workspace 依赖项有增减，同步改这里的
# [workspace.dependencies]，否则 standalone 构建会报 "dependency not found in workspace"。

[workspace]
members = ["crates/allium-deck"]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# 与生产一致的 release profile（性能数字必须在此 profile 下测）。
[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
