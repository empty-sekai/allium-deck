.deck-wasm-download-masterdata: &deck_wasm_download_masterdata
  name: Download CN masterdata
  script: |
    set -e
    . .tmp/cnb-wasm.env
    python3 scripts/download_masterdata.py \
      --region "$REGION" \
      --cdn-base "$CDN_BASE" \
      --out-dir "$MASTERDATA_DIR" \
      --music-metas "$MUSIC_METAS" \
      --manifest-out "$MASTERDATA_MANIFEST" \
      --version "$MASTERDATA_VERSION" \
      --workers "${DOWNLOAD_WORKERS:-8}"

.deck-wasm-build-gamedata: &deck_wasm_build_gamedata
  name: Build embedded gamedata
  script: |
    set -e
    . .tmp/cnb-wasm.env
    cargo run --release --bin build_gamedata -- \
      --masterdata "$MASTERDATA_DIR" \
      --music-metas "$MUSIC_METAS" \
      --region "$REGION"

.deck-wasm-build: &deck_wasm_build
  name: Build wasm
  script: |
    set -e
    export CARGO_PROFILE_RELEASE_CODEGEN_UNITS=1
    export CARGO_PROFILE_RELEASE_LTO=fat
    export CARGO_PROFILE_RELEASE_OPT_LEVEL=3
    export CARGO_PROFILE_RELEASE_PANIC=abort
    wasm-pack build --target web --features wasm

.deck-wasm-package-files: &deck_wasm_package_files
  name: Package CDN files
  script: |
    set -e
    . .tmp/cnb-wasm.env
    python3 scripts/package_wasm.py \
      --pkg-dir pkg \
      --out-dir "$DIST_DIR" \
      --region "$REGION" \
      --version "$MASTERDATA_VERSION" \
      --cdn-base "$CDN_BASE" \
      --source-repository "$SOURCE_REPOSITORY" \
      --source-revision "$SOURCE_REVISION" \
      --masterdata-manifest "$MASTERDATA_MANIFEST"

.deck-wasm-publish: &deck_wasm_publish
  name: build and publish deck wasm
  docker:
    build:
      dockerfile: docker/Dockerfile.wasm-ci
      by:
        - docker/Dockerfile.wasm-ci
      versionBy:
        - docker/Dockerfile.wasm-ci
    volumes:
      - /usr/local/cargo/registry
      - /usr/local/cargo/git
      - target
  imports:
    - https://cnb.cool/emptysekai/allium-secrets/-/blob/main/cos.yml
  runner:
    cpus: 2
  stages:
    - name: Verify toolchain
      script: |
        set -e
        rustc --version
        cargo --version
        wasm-pack --version
        python3 - <<'PY'
        import boto3
        import qcloud_cos
        print("python upload SDKs ok")
        PY
    - name: Resolve inputs
      script: |
        set -e
        python3 scripts/resolve_wasm_inputs.py --mode publish --env-out .tmp/cnb-wasm.env
        cat .tmp/cnb-wasm.env
    - *deck_wasm_download_masterdata
    - *deck_wasm_build_gamedata
    - *deck_wasm_build
    - *deck_wasm_package_files
    - name: Upload CDN prefixes
      lock:
        key: allium-deck-wasm-cdn
        wait: true
        timeout: 600
      script: |
        set -e
        . .tmp/cnb-wasm.env

        export COS_BUCKET="${COS_BUCKET:-${S3_BUCKET:-${SCAPUS_S3_BUCKET:-}}}"
        export COS_REGION="${COS_REGION:-${S3_REGION:-${SCAPUS_S3_REGION:-}}}"
        export COS_SECRET_ID="${COS_SECRET_ID:-${S3_ACCESS_KEY_ID:-${SCAPUS_S3_ACCESS_KEY_ID:-${SCAPUS_S3_ACCESS_KEY:-}}}}"
        export COS_SECRET_KEY="${COS_SECRET_KEY:-${S3_ACCESS_KEY_SECRET:-${SCAPUS_S3_SECRET_KEY:-}}}"
        export S3_BUCKET="${S3_BUCKET:-$COS_BUCKET}"
        export S3_REGION="${S3_REGION:-$COS_REGION}"
        export S3_ACCESS_KEY_ID="${S3_ACCESS_KEY_ID:-$COS_SECRET_ID}"
        export S3_ACCESS_KEY_SECRET="${S3_ACCESS_KEY_SECRET:-$COS_SECRET_KEY}"
        export S3_ENDPOINT="${S3_ENDPOINT:-${SCAPUS_S3_ENDPOINT:-}}"

        if [ -z "$COS_BUCKET" ] || [ -z "$COS_REGION" ] || [ -z "$COS_SECRET_ID" ] || [ -z "$COS_SECRET_KEY" ]; then
          echo "missing COS/S3 environment variables" >&2
          exit 1
        fi

        python3 scripts/upload_cos.py \
          --dir "$DIST_DIR" \
          --prefix "deck-wasm/$REGION/$MASTERDATA_VERSION" \
          --cache-control "public,max-age=31536000,immutable" \
          --backend "${UPLOAD_BACKEND:-qcloud}"

        if [ "${PUBLISH_LATEST:-}" = "false" ]; then
          echo "skip latest prefix because PUBLISH_LATEST=false"
          exit 0
        fi
        if [ "${CNB_BRANCH:-}" = "main" ] || \
           [ "${CNB_EVENT:-}" = "api_trigger" ] || \
           [ "${CNB_EVENT:-}" = "api_trigger_deck_wasm_publish" ] || \
           [ "${CNB_EVENT:-}" = "web_trigger" ] || \
           [ "${CNB_EVENT:-}" = "web_trigger_deck_wasm_publish" ] || \
           [ "${PUBLISH_LATEST:-}" = "true" ]; then
          python3 scripts/upload_cos.py \
            --dir "$DIST_DIR" \
            --prefix "deck-wasm/$REGION/latest" \
            --cache-control "public,max-age=300" \
            --backend "${UPLOAD_BACKEND:-qcloud}"
        else
          echo "skip latest prefix for branch ${CNB_BRANCH:-unknown} event ${CNB_EVENT:-unknown}"
        fi

.deck-wasm-release: &deck_wasm_release
  name: build wasm release package
  docker:
    build:
      dockerfile: docker/Dockerfile.wasm-ci
      by:
        - docker/Dockerfile.wasm-ci
      versionBy:
        - docker/Dockerfile.wasm-ci
    volumes:
      - /usr/local/cargo/registry
      - /usr/local/cargo/git
      - target
  imports:
    - https://cnb.cool/emptysekai/allium-secrets/-/blob/main/github.yml
  runner:
    cpus: 2
  stages:
    - name: Verify toolchain
      script: |
        set -e
        rustc --version
        cargo --version
        wasm-pack --version
        python3 - <<'PY'
        import boto3
        import qcloud_cos
        print("python upload SDKs ok")
        PY
    - name: Resolve inputs
      script: |
        set -e
        python3 scripts/resolve_wasm_inputs.py --mode release --env-out .tmp/cnb-wasm.env
        cat .tmp/cnb-wasm.env
    - *deck_wasm_download_masterdata
    - *deck_wasm_build_gamedata
    - *deck_wasm_build
    - name: Package release zip
      script: |
        set -e
        . .tmp/cnb-wasm.env
        python3 scripts/package_wasm.py \
          --pkg-dir pkg \
          --out-dir "$DIST_DIR" \
          --region "$REGION" \
          --version "$MASTERDATA_VERSION" \
          --cdn-base "$CDN_BASE" \
          --source-repository "$SOURCE_REPOSITORY" \
          --source-revision "$SOURCE_REVISION" \
          --masterdata-manifest "$MASTERDATA_MANIFEST"
        mkdir -p release
        (cd "$DIST_DIR" && zip -9 -r "../../$WASM_ZIP" .)
        mv "$WASM_ZIP" "release/$WASM_ZIP"
        cat > release/github-release-body.md <<EOF
        CNB-built WASM package for $RELEASE_TAG.

        Source revision: $SOURCE_REVISION
        Masterdata label: $MASTERDATA_VERSION
        CDN base: $CDN_BASE
        EOF
    - name: Upload GitHub Release asset
      script: |
        set -e
        . .tmp/cnb-wasm.env
        python3 scripts/upload_github_release.py \
          --repo "${GITHUB_RELEASE_REPO:-empty-sekai/allium-deck}" \
          --tag "$RELEASE_TAG" \
          --title "$RELEASE_TAG" \
          --body-file release/github-release-body.md \
          --asset "release/$WASM_ZIP" \
          --clobber

main:
  push:
    - *deck_wasm_publish

"codex/fix-deck-wasm-ci-upload":
  push:
    - <<: *deck_wasm_publish
      env:
        PUBLISH_LATEST: "true"

$:
  api_trigger:
    - *deck_wasm_publish
  api_trigger_deck_wasm_publish:
    - *deck_wasm_publish
  web_trigger:
    - *deck_wasm_publish
  web_trigger_deck_wasm_publish:
    - *deck_wasm_publish
  tag_push:
    - *deck_wasm_release
