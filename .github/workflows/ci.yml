name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-features --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # benchmark_proof brute-force cases skip gracefully without masterdata.
      - run: cargo test --all-features

  msrv:
    name: msrv (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89"
      - uses: Swatinem/rust-cache@v2
      # --locked so this job measures what the crate's own code needs, rather than
      # tracking whichever MSRV the latest compatible dependency release happens to have.
      - run: cargo check --all-features --locked

  server:
    # server/ is its own workspace, so the jobs above do not reach it.
    name: server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo fmt --all --check
      # The allocator features are mutually exclusive, so they are linted one at a time
      # rather than with --all-features.
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --features jemalloc -- -D warnings
      - run: cargo clippy --all-targets --features mimalloc -- -D warnings
      - run: cargo test --release
