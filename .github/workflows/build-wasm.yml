name: build-wasm

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-wasm.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "wasm/**"
      - "scripts/download_masterdata.py"
      - "scripts/package_wasm.py"
      - "scripts/resolve_wasm_inputs.py"
      - "scripts/smoke_wasm_package.mjs"
  schedule:
    # 每日 20:00 UTC（北京时间次日凌晨 4 点）对齐上游 masterdata 更新
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      region:
        description: "Masterdata region"
        required: true
        default: "cn"
        type: choice
        options:
          - cn
          - jp
      masterdata_version:
        description: "Upstream commit SHA; default resolves latest Team-Haruki master"
        required: false
      cdn_base:
        description: "Public COS/EO base URL"
        required: true
        default: "https://cdn.emptysekai.com"
  repository_dispatch:
    types:
      - masterdata-updated
      - deck-wasm-build

permissions:
  contents: read

concurrency:
  group: deck-wasm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build wasm artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set reproducible build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Resolve build inputs
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request

          with open(os.environ["GITHUB_EVENT_PATH"], "r", encoding="utf-8") as handle:
              event = json.load(handle)

          inputs = event.get("inputs") or {}
          payload = event.get("client_payload") or {}
          region = (payload.get("region") or inputs.get("region") or "cn").strip()
          cdn_base = (payload.get("cdn_base") or inputs.get("cdn_base") or "https://cdn.emptysekai.com").strip().rstrip("/")
          # 上游 Team-Haruki masterdata 的 commit SHA（不可变发布标签）；
          # 留空时由 download 脚本解析上游 master 最新提交。
          version = (payload.get("masterdata_version") or inputs.get("masterdata_version") or "").strip()
          if version:
              version = re.sub(r"[^A-Za-z0-9._-]+", "-", version).strip("-")
          if not version:
              version = "latest-upstream"
          if region not in ("cn", "jp"):
              raise SystemExit(f"unsupported region: {region}")

          env_path = os.environ["GITHUB_ENV"]
          with open(env_path, "a", encoding="utf-8") as env:
              env.write(f"REGION={region}\n")
              env.write(f"CDN_BASE={cdn_base}\n")
              env.write(f"MASTERDATA_VERSION={version}\n")
              env.write("MASTERDATA_DIR=.tmp/masterdata/cn\n")
              env.write("MUSIC_METAS=.tmp/music_metas/cn/music_metas.json\n")
              env.write("MASTERDATA_MANIFEST=.tmp/masterdata-manifest.json\n")
              env.write("DIST_DIR=dist/deck-wasm\n")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"region: `{region}`\n\n")
              summary.write(f"release label: `{version}`\n\n")
              summary.write(f"latest URL: `{cdn_base}/deck-wasm/{region}/latest/allium_deck.js`\n")
          PY

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.98.0
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          cache-on-failure: true

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: Download public COS masterdata
        run: |
          python3 scripts/download_masterdata.py \
            --region "$REGION" \
            --cdn-base "$CDN_BASE" \
            --out-dir "$MASTERDATA_DIR" \
            --music-metas "$MUSIC_METAS" \
            --manifest-out "$MASTERDATA_MANIFEST" \
            --version "$MASTERDATA_VERSION" \
            --snapshot-mode latest

      - name: Build wasm
        env:
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
          CARGO_PROFILE_RELEASE_LTO: "fat"
          CARGO_PROFILE_RELEASE_OPT_LEVEL: "3"
          CARGO_PROFILE_RELEASE_PANIC: "abort"
        run: wasm-pack build wasm --target web --scope empty-sekai

      - name: Package CDN files
        run: |
          python3 scripts/package_wasm.py \
            --pkg-dir wasm/pkg \
            --out-dir "$DIST_DIR" \
            --region "$REGION" \
            --version "$MASTERDATA_VERSION" \
            --cdn-base "$CDN_BASE" \
            --source-repository "$GITHUB_REPOSITORY" \
            --source-revision "$GITHUB_SHA" \
            --masterdata-manifest "$MASTERDATA_MANIFEST"

      - name: Pack npm package
        run: |
          mkdir -p dist/npm
          {
            echo "allium-deck-wasm is available under either license below."
            echo
            echo "===== MIT ====="
            echo
            cat LICENSE-MIT
            echo
            echo "===== Apache-2.0 ====="
            echo
            cat LICENSE-APACHE
          } > wasm/pkg/LICENSE
          (cd wasm/pkg && npm pack --pack-destination ../../dist/npm)

      - name: Smoke-test npm package
        run: |
          INSTALL_ROOT=$(mktemp -d)
          NPM_PACKAGE=$(realpath dist/npm/*.tgz)
          npm install --prefix "$INSTALL_ROOT" "$NPM_PACKAGE"
          cp scripts/smoke_wasm_package.mjs "$INSTALL_ROOT/smoke.mjs"
          node "$INSTALL_ROOT/smoke.mjs"

      - name: Upload GitHub artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deck-wasm-${{ env.REGION }}-${{ env.MASTERDATA_VERSION }}
          path: |
            ${{ env.DIST_DIR }}
            dist/npm/*.tgz
