name: lint-commits

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    name: conventional commit lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install commitlint
        run: npm install -g @commitlint/cli @commitlint/config-conventional

      - name: Lint pull request commits
        if: github.event_name == 'pull_request'
        run: npx commitlint --extends @commitlint/config-conventional --from=${{ github.event.pull_request.base.sha }} --to=${{ github.event.pull_request.head.sha }} --verbose

      - name: Lint pushed commit
        if: github.event_name == 'push'
        run: npx commitlint --extends @commitlint/config-conventional --last --verbose
