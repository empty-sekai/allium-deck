name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets

      - name: cargo test
        run: cargo test --lib --release

      - name: cargo build (bin)
        run: cargo build --release --bin recommend_cli

  build-binaries:
    name: build (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bin_name: recommend_cli
            asset_name: linux-x86_64
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            bin_name: recommend_cli
            asset_name: linux-x86_64-musl
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            bin_name: recommend_cli
            asset_name: linux-aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin_name: recommend_cli.exe
            asset_name: windows-x86_64.exe
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.os == 'ubuntu-latest'
        run: cargo install cross --locked

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build (linux gnu)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo build --release --target ${{ matrix.target }} --bin recommend_cli

      - name: Build (linux musl/aarch64)
        if: matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-unknown-linux-gnu'
        run: cross build --release --target ${{ matrix.target }} --bin recommend_cli

      - name: Build (windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: cargo build --release --target ${{ matrix.target }} --bin recommend_cli

      - name: Package executable
        shell: bash
        run: |
          mkdir -p release
          cp target/${{ matrix.target }}/release/${{ matrix.bin_name }} release/recommend_cli-${{ github.ref_name }}-${{ matrix.asset_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: recommend_cli-${{ matrix.target }}
          path: release/*

  release:
    name: release
    needs: [test, build-binaries]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install git-cliff
        run: cargo install git-cliff --locked

      - name: Generate CHANGELOG
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          git-cliff --tag "v${VERSION}" --output CHANGELOG.md

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/**/recommend_cli-*
