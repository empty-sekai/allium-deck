name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-registry-token:
    name: verify crates.io token configuration
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Validate crates.io token configuration
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "CARGO_REGISTRY_TOKEN is not configured" >&2
            exit 1
          fi
          if ! [[ "$CARGO_REGISTRY_TOKEN" =~ ^cio[[:alnum:]]{32}$ ]]; then
            echo "CARGO_REGISTRY_TOKEN must contain only the raw crates.io token (cio + 32 characters)" >&2
            exit 1
          fi

  test:
    name: test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set reproducible build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Verify release tag matches package versions
        if: github.event_name == 'push'
        shell: bash
        run: |
          EXPECTED="${GITHUB_REF_NAME#v}"
          DECK_VERSION=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          WASM_VERSION=$(cargo metadata --manifest-path wasm/Cargo.toml --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          test "$DECK_VERSION" = "$EXPECTED"
          test "$WASM_VERSION" = "$EXPECTED"

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2

      - name: cargo fmt
        run: |
          cargo fmt -- --check
          cargo fmt --manifest-path wasm/Cargo.toml -- --check

      - name: cargo clippy
        run: |
          cargo clippy --all-targets
          cargo clippy --manifest-path wasm/Cargo.toml --all-targets

      - name: cargo test
        run: |
          cargo test --all-targets --release
          cargo test --manifest-path wasm/Cargo.toml --all-targets --release

      - name: release packaging tests
        run: python3 tests/test_release_packaging.py

      - name: cargo build (bin)
        run: cargo build --release --bin recommend_cli

      - name: Verify crates.io package boundary
        shell: bash
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(item["version"] for item in json.load(sys.stdin)["packages"] if item["name"] == "allium-deck"))')
          CRATE="target/package/allium-deck-${VERSION}.crate"
          rm -f "$CRATE"
          cargo package --locked -p allium-deck
          PACKAGE_FILES=$(cargo package --locked -p allium-deck --list)
          if grep -Eq '(^|/)wasm/|src/(wasm|embedded)\.rs|\.postcard$' <<<"$PACKAGE_FILES"; then
            echo "allium-deck crate package unexpectedly contains WASM files" >&2
            exit 1
          fi
          # wasm-bindgen is a legitimate transitive dependency of web-time, the
          # portable Instant shim the engine uses on wasm32; only the bindings
          # crate itself must stay out of the published package.
          PACKAGE_LOCK=$(tar -xOf "$CRATE" "allium-deck-${VERSION}/Cargo.lock")
          if grep -Eq 'name = "allium-deck-wasm"' <<<"$PACKAGE_LOCK"; then
            echo "allium-deck crate package lock unexpectedly contains the WASM bindings crate" >&2
            exit 1
          fi
          rm -f "$CRATE"
          cargo publish --locked --dry-run -p allium-deck

  build-binaries:
    name: build (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bin_name: recommend_cli
            asset_name: linux-x86_64
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            bin_name: recommend_cli
            asset_name: linux-x86_64-musl
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            bin_name: recommend_cli
            asset_name: linux-aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin_name: recommend_cli.exe
            asset_name: windows-x86_64.exe
          - target: aarch64-apple-darwin
            os: macos-15
            bin_name: recommend_cli
            asset_name: macos-aarch64
          - target: x86_64-apple-darwin
            os: macos-15-intel
            bin_name: recommend_cli
            asset_name: macos-x86_64
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set reproducible build timestamp
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.os == 'ubuntu-latest'
        run: cargo install cross --version 0.2.5 --locked

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          cache-on-failure: true

      - name: Build (linux gnu)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo build --release --target ${{ matrix.target }} --bin recommend_cli

      - name: Build (linux musl/aarch64)
        if: matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-unknown-linux-gnu'
        run: cross build --release --target ${{ matrix.target }} --bin recommend_cli

      - name: Build (windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: cargo build --release --target ${{ matrix.target }} --bin recommend_cli

      - name: Build (macOS)
        if: startsWith(matrix.os, 'macos-')
        run: cargo build --release --target ${{ matrix.target }} --bin recommend_cli

      - name: Package executable
        shell: bash
        run: |
          mkdir -p release
          cp target/${{ matrix.target }}/release/${{ matrix.bin_name }} release/recommend_cli-${{ github.ref_name }}-${{ matrix.asset_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: recommend_cli-${{ matrix.target }}
          path: release/*

  build-wasm-release:
    name: build WASM npm package
    needs: test
    runs-on: ubuntu-latest
    outputs:
      masterdata-version: ${{ steps.inputs.outputs.masterdata-version }}
    # npm trusted publishing 需要 OIDC token，必须在能发出它的 job 层声明；
    # 顶层 `permissions: contents: read` 会被这里的 job 级设置覆盖。
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set reproducible build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Resolve WASM release inputs
        id: inputs
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            INPUT_FILE="release-inputs/${GITHUB_REF_NAME}.json"
          else
            VERSION=$(cargo metadata --manifest-path wasm/Cargo.toml --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
            INPUT_FILE="release-inputs/v${VERSION}.json"
          fi
          test -f "$INPUT_FILE"
          MASTERDATA_VERSION=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["masterdata_version"])' "$INPUT_FILE")
          MUSIC_METAS_SHA256=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["music_metas_sha256"])' "$INPUT_FILE")
          WASM_ZIP="allium-deck-wasm-${GITHUB_REF_NAME}-${MASTERDATA_VERSION}-cn.zip"
          NPM_TGZ="allium-deck-wasm-${GITHUB_REF_NAME}.tgz"
          {
            echo "REGION=cn"
            echo "CDN_BASE=https://cdn.emptysekai.com"
            echo "MASTERDATA_VERSION=${MASTERDATA_VERSION}"
            echo "MUSIC_METAS_SHA256=${MUSIC_METAS_SHA256}"
            echo "MASTERDATA_DIR=.tmp/masterdata/cn"
            echo "MUSIC_METAS=.tmp/music_metas/cn/music_metas.json"
            echo "MASTERDATA_MANIFEST=.tmp/masterdata-manifest.json"
            echo "DIST_DIR=dist/deck-wasm"
            echo "WASM_ZIP=${WASM_ZIP}"
            echo "NPM_TGZ=${NPM_TGZ}"
          } >> "$GITHUB_ENV"
          echo "masterdata-version=${MASTERDATA_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.98.0
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          cache-on-failure: true

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: Download CN masterdata snapshot
        run: |
          python3 scripts/download_masterdata.py \
            --region "$REGION" \
            --cdn-base "$CDN_BASE" \
            --out-dir "$MASTERDATA_DIR" \
            --music-metas "$MUSIC_METAS" \
            --manifest-out "$MASTERDATA_MANIFEST" \
            --version "$MASTERDATA_VERSION" \
            --snapshot-mode pinned \
            --expected-music-sha256 "$MUSIC_METAS_SHA256"

      - name: Build WASM npm package
        env:
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
          CARGO_PROFILE_RELEASE_LTO: "fat"
          CARGO_PROFILE_RELEASE_OPT_LEVEL: "3"
          CARGO_PROFILE_RELEASE_PANIC: "abort"
        run: wasm-pack build wasm --target web --scope empty-sekai

      - name: Package release files
        run: |
          python3 scripts/package_wasm.py \
            --pkg-dir wasm/pkg \
            --out-dir "$DIST_DIR" \
            --region "$REGION" \
            --version "$MASTERDATA_VERSION" \
            --cdn-base "$CDN_BASE" \
            --source-repository "$GITHUB_REPOSITORY" \
            --source-revision "$GITHUB_SHA" \
            --masterdata-manifest "$MASTERDATA_MANIFEST"
          mkdir -p release
          python3 scripts/create_reproducible_zip.py \
            --source-dir "$DIST_DIR" \
            --output "release/$WASM_ZIP"
          {
            echo "allium-deck-wasm is available under either license below."
            echo
            echo "===== MIT ====="
            echo
            cat LICENSE-MIT
            echo
            echo "===== Apache-2.0 ====="
            echo
            cat LICENSE-APACHE
          } > wasm/pkg/LICENSE
          (cd wasm/pkg && npm pack --pack-destination ../../release)
          mv release/empty-sekai-allium-deck-wasm-*.tgz "release/$NPM_TGZ"

      - name: Set up Node for npm trusted publishing
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Smoke-test npm package
        run: |
          INSTALL_ROOT=$(mktemp -d)
          NPM_PACKAGE=$(realpath "release/$NPM_TGZ")
          npm install --prefix "$INSTALL_ROOT" "$NPM_PACKAGE"
          cp scripts/smoke_wasm_package.mjs "$INSTALL_ROOT/smoke.mjs"
          node "$INSTALL_ROOT/smoke.mjs"

      - name: Publish to npm (trusted publishing)
        run: |
          # trusted publishing 硬门槛：npm CLI >= 11.5.1 / Node >= 22.14。
          # runner 自带版本未必满足，强制升到 latest。
          npm install -g npm@latest
          # trusted publishing 校验 package.json 的 repository.url 与 GitHub 仓库一致，
          # 缺了会报 "Repository URL mismatch"。wasm-pack 生成的 package.json 不带该字段，
          # 此处补上并显式设为 public（scoped 包默认 restricted）。
          node -e "const fs=require('fs');const p='wasm/pkg/package.json';const j=JSON.parse(fs.readFileSync(p));j.repository={type:'git',url:'git+https://github.com/empty-sekai/allium-deck.git'};j.publishConfig={access:'public'};fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')"
          cd wasm/pkg
          npm publish --provenance

      - name: Upload WASM release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: allium-deck-wasm-${{ github.ref_name }}-cn
          path: |
            release/*.zip
            release/*.tgz

  publish-crate:
    name: publish crate
    needs: [test, build-binaries, build-wasm-release]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set reproducible build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.98.0

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(item["version"] for item in json.load(sys.stdin)["packages"] if item["name"] == "allium-deck"))')
          CRATE="target/package/allium-deck-${VERSION}.crate"
          rm -f "$CRATE"
          cargo package --locked -p allium-deck
          LOCAL_CHECKSUM=$(sha256sum "$CRATE" | cut -d' ' -f1)
          set +e
          python3 scripts/verify_crates_checksum.py \
            --crate allium-deck \
            --version "$VERSION" \
            --checksum "$LOCAL_CHECKSUM" \
            --attempts 1
          LOOKUP_STATUS=$?
          set -e
          case "$LOOKUP_STATUS" in
            0) exit 0 ;;
            3) ;;
            *) exit "$LOOKUP_STATUS" ;;
          esac
          rm -f "$CRATE"
          set +e
          cargo publish --locked -p allium-deck
          PUBLISH_STATUS=$?
          set -e
          if python3 scripts/verify_crates_checksum.py \
            --crate allium-deck \
            --version "$VERSION" \
            --checksum "$LOCAL_CHECKSUM" \
            --attempts 12 \
            --delay 5; then
            if [ "$PUBLISH_STATUS" -ne 0 ]; then
              echo "cargo publish returned ${PUBLISH_STATUS}, but crates.io now has the matching package"
            fi
            exit 0
          fi
          exit 1

  release:
    name: release
    needs: [publish-crate, build-wasm-release]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set reproducible build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.98.0

      - name: Install git-cliff
        run: cargo install git-cliff --version 2.13.1 --locked

      - name: Generate CHANGELOG
        env:
          MASTERDATA_VERSION: ${{ needs.build-wasm-release.outputs.masterdata-version }}
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -n "$PREVIOUS_TAG" ]; then
            RANGE="${PREVIOUS_TAG}..${GITHUB_REF_NAME}"
          else
            RANGE="${GITHUB_REF_NAME}"
          fi
          git-cliff --tag "${GITHUB_REF_NAME}" --output CHANGELOG.md "$RANGE"
          {
            echo ""
            echo "### Assets"
            echo "| Asset | Description |"
            echo "|-------|------------|"
            echo "| \`recommend_cli-${GITHUB_REF_NAME}-*\` | Prebuilt CLI binaries (Linux x86_64 / musl / aarch64, Windows x86_64, macOS Intel / Apple Silicon) |"
            echo "| \`allium-deck-wasm-${GITHUB_REF_NAME}.tgz\` | Installable npm package \`@empty-sekai/allium-deck-wasm\` |"
            echo "| \`allium-deck-wasm-${GITHUB_REF_NAME}-${MASTERDATA_VERSION}-cn.zip\` | Browser WASM bundle paired with the CN masterdata snapshot |"
          } >> CHANGELOG.md

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/**/recommend_cli-*
            artifacts/**/allium-deck-wasm-*.zip
            artifacts/**/allium-deck-wasm-*.tgz
