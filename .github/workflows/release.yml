name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets

      - name: cargo test
        run: cargo test --lib --release

      - name: cargo build (bin)
        run: cargo build --release --bin recommend_cli

  build-binaries:
    name: build (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bin_name: recommend_cli
            asset_name: linux-x86_64
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            bin_name: recommend_cli
            asset_name: linux-x86_64-musl
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            bin_name: recommend_cli
            asset_name: linux-aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin_name: recommend_cli.exe
            asset_name: windows-x86_64.exe
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.os == 'ubuntu-latest'
        run: cargo install cross --locked

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build (linux gnu)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo build --release --target ${{ matrix.target }} --bin recommend_cli

      - name: Build (linux musl/aarch64)
        if: matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-unknown-linux-gnu'
        run: cross build --release --target ${{ matrix.target }} --bin recommend_cli

      - name: Build (windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: cargo build --release --target ${{ matrix.target }} --bin recommend_cli

      - name: Package executable
        shell: bash
        run: |
          mkdir -p release
          cp target/${{ matrix.target }}/release/${{ matrix.bin_name }} release/recommend_cli-${{ github.ref_name }}-${{ matrix.asset_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: recommend_cli-${{ matrix.target }}
          path: release/*

  build-wasm-release:
    name: build wasm release package
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Resolve WASM release inputs
        run: |
          {
            echo "REGION=cn"
            echo "CDN_BASE=https://cdn.emptysekai.com"
            echo "MASTERDATA_VERSION=${GITHUB_REF_NAME}"
            echo "MASTERDATA_DIR=.tmp/masterdata/cn"
            echo "MUSIC_METAS=.tmp/music_metas/cn/music_metas.json"
            echo "MASTERDATA_MANIFEST=.tmp/masterdata-manifest.json"
            echo "DIST_DIR=dist/deck-wasm"
            echo "WASM_ZIP=allium-deck-wasm-${GITHUB_REF_NAME}-cn.zip"
          } >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: Download CN latest masterdata snapshot
        run: |
          python3 scripts/download_masterdata.py \
            --region "$REGION" \
            --cdn-base "$CDN_BASE" \
            --out-dir "$MASTERDATA_DIR" \
            --music-metas "$MUSIC_METAS" \
            --manifest-out "$MASTERDATA_MANIFEST" \
            --version "$MASTERDATA_VERSION"

      - name: Build embedded gamedata
        run: |
          cargo run --release --bin build_gamedata -- \
            --masterdata "$MASTERDATA_DIR" \
            --music-metas "$MUSIC_METAS" \
            --region "$REGION"

      - name: Build wasm
        env:
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
          CARGO_PROFILE_RELEASE_LTO: "fat"
          CARGO_PROFILE_RELEASE_OPT_LEVEL: "3"
          CARGO_PROFILE_RELEASE_PANIC: "abort"
        run: wasm-pack build --target web --features wasm

      - name: Package WASM files
        run: |
          python3 scripts/package_wasm.py \
            --pkg-dir pkg \
            --out-dir "$DIST_DIR" \
            --region "$REGION" \
            --version "$MASTERDATA_VERSION" \
            --cdn-base "$CDN_BASE" \
            --source-repository "$GITHUB_REPOSITORY" \
            --source-revision "$GITHUB_SHA" \
            --masterdata-manifest "$MASTERDATA_MANIFEST"
          mkdir -p release
          (cd "$DIST_DIR" && zip -9 -r "../../$WASM_ZIP" .)
          mv "$WASM_ZIP" release/

      - name: Upload WASM release artifact
        uses: actions/upload-artifact@v4
        with:
          name: allium-deck-wasm-${{ github.ref_name }}-cn
          path: release/*.zip

  release:
    name: release
    needs: [test, build-binaries, build-wasm-release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install git-cliff
        run: cargo install git-cliff --locked

      - name: Generate CHANGELOG
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -n "$PREVIOUS_TAG" ]; then
            RANGE="${PREVIOUS_TAG}..${GITHUB_REF_NAME}"
          else
            RANGE="${GITHUB_REF_NAME}"
          fi
          git-cliff --tag "${GITHUB_REF_NAME}" --output CHANGELOG.md "$RANGE"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/**/recommend_cli-*
            artifacts/**/allium-deck-wasm-*.zip
