[package]
name = "allium-deck-wasm"
version = "0.0.8"
edition = "2024"
description = "Browser WASM bindings and embedded Project Sekai data for allium-deck"
license = "MIT OR Apache-2.0"
repository = "https://github.com/empty-sekai/allium-deck"
publish = false

[workspace]
resolver = "2"

# 性能优先的 release 配置（wasm 场景）：opt-level 3 + fat LTO + abort + 去符号。
# 搜索热路径对 opt-level 敏感；体积差主要由 gzip 传输吸收。
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[lib]
name = "allium_deck"
crate-type = ["cdylib"]

[[bin]]
name = "build_gamedata"
required-features = ["embedded"]

[[bin]]
name = "decode_bench"
required-features = ["embedded"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = true
# 注意不能用 --all-features：会把 wasm-bindgen test 导出打进去，破坏 Node 侧加载；
# 特性开关逐项列出（wasm-bindgen 0.2 产物所需集合）。
wasm-opt-args = ["-O3", "--converge", "--enable-bulk-memory", "--enable-sign-ext", "--enable-nontrapping-float-to-int", "--enable-mutable-globals", "--enable-reference-types", "--strip-dwarf", "--strip-producers"]

[features]
default = []
# 编译期内嵌 cn postcard 数据（离线 demo / 旧调用方）；外置 masterdata 模式无需
embedded = ["dep:postcard"]

[dependencies]
allium-deck = { path = "..", version = "=0.0.8" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["use-std"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
