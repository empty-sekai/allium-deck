[package]
name = "allium-deck-wasm"
version = "0.0.14"
edition = "2024"
description = "Browser WASM bindings for allium-deck"
license = "MIT OR Apache-2.0"
repository = "https://github.com/empty-sekai/allium-deck"
publish = false

[workspace]
resolver = "2"

# 性能优先的 release 配置（wasm 场景）：opt-level 3 + fat LTO + abort + 去符号。
# 搜索热路径对 opt-level 敏感；体积差主要由 gzip 传输吸收。
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[lib]
name = "allium_deck"
crate-type = ["cdylib"]

[package.metadata.wasm-pack.profile.release]
# `wasm-opt` 直接接受传给 binaryen 的参数数组；没有独立的 `wasm-opt-args` 键，
# 后者会被 wasm-pack 0.15 判为 unknown 并忽略，导致 wasm-opt 不带 feature 开关运行
# ——产物一旦用到 bulk-memory，validator 就会拒绝。
# 注意不能用 --all-features：会把 wasm-bindgen test 导出打进去，破坏 Node 侧加载；
# feature 开关逐项列出（wasm-bindgen 0.2 产物所需集合）。
wasm-opt = ["-O3", "--converge", "--enable-bulk-memory", "--enable-sign-ext", "--enable-nontrapping-float-to-int", "--enable-mutable-globals", "--enable-reference-types", "--strip-dwarf", "--strip-producers"]

[dependencies]
allium-deck = { path = "..", version = "=0.0.14" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
