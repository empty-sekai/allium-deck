[package]
name = "allium-deck"
version = "0.0.5"
edition = "2021"
description = "Project Sekai deck recommendation engine: DFS / branch-and-bound exact search"
license = "MIT OR Apache-2.0"
repository = "https://github.com/empty-sekai/allium-deck"
include = [
    "/Cargo.toml",
    "/README.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
    "/src/**",
    "/data/**",
]

[lib]
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[package.metadata.docs.rs]
all-features = true
