[package]
name = "allium-deck"
version = "0.0.7"
edition = "2021"
rust-version = "1.89"
description = "Project Sekai deck recommendation engine: DFS / branch-and-bound exact search"
license = "MIT OR Apache-2.0"
repository = "https://github.com/empty-sekai/allium-deck"
readme = "README.en.md"
include = [
    "/Cargo.toml",
    "/README.md",
    "/README.en.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
    "/src/**",
    "/data/**",
]

[lints.clippy]
# 搜索热路径的递归状态刻意用显式参数传递，不打包结构体。
too_many_arguments = "allow"

[lib]
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["rayon", "cargo_bench_support"] }

[[bench]]
name = "bench_deck"
harness = false

[package.metadata.docs.rs]
all-features = true
