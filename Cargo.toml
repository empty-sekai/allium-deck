[package]
name = "allium-deck"
version = "0.0.3"
edition = "2021"
description = "Project Sekai deck recommendation engine: DFS / branch-and-bound exact search"
license = "MIT OR Apache-2.0"
include = [
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
    "src/**",
    "data/**",
]

[lib]
# cdylib: wasm-pack 产出 .wasm；rlib: 保留给 scapus / CLI / 测试以库形式链接。
crate-type = ["cdylib", "rlib"]

[features]
# wasm 浏览器入口：仅此 feature 引入 wasm-bindgen 与内嵌 masterdata 读取。
# native（scapus/CLI）默认不开，依赖图与二进制零变化。
wasm = ["dep:wasm-bindgen", "dep:console_error_panic_hook"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# 紧凑二进制序列化：构建期把扁平 masterdata 编成 .postcard 内嵌，wasm 端零 JSON 解析还原。
# 纯 Rust，native 编译无副作用，故作常规依赖。
postcard = { version = "1", features = ["use-std"] }

# wasm-bindgen 仅在 wasm32 目标 + wasm feature 下进依赖图。
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }

[package.metadata.docs.rs]
all-features = true
